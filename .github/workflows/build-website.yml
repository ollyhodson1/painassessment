
name: Build SPL9 pain assessment website

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/build-website.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare content for Vite
        run: |
          cp public/content.json src/content.json
          sed -i "s|../public/content.json|./content.json|" src/main.jsx

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build self-contained React website
        run: npm run build

      - name: Check the output
        run: |
          test -f docs/index.html
          test -d docs/assets
          if grep -R -n 'esm.sh' docs/index.html docs/assets; then
            echo '::error::Build still references esm.sh'
            exit 1
          fi
          echo 'Bundled React assets verified.'

      - name: Publish website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f docs
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
          else
            git commit -m 'Build standalone React site'
            git push
          fi
